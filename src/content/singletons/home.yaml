  subtitle: Private Villa in Hoi An
  text: >-
    A quiet garden villa between the rice fields and the Ancient Town —
    made for slow mornings, long swims and lantern-lit evenings.
  buttonLabel: Check Availability
  image: ../../assets/images/home/hero.jpg
villa:
  eyebrow: The Villa
  heading: Your home in Hoi An
  text: >-
    Tom's House is a private villa for families and friends who want space,
    calm and a true taste of local life. Wake up to birdsong in the garden,
    cool off in the pool, then cycle into town for dinner by the river.
