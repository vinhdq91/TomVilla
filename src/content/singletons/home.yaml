location:
  eyebrow: Location
  heading: Between the rice fields and the river
  text: >-
    Close enough to cycle into the Ancient Town, far enough to hear only the
    garden at night. The beach, cooking classes and the lantern-lit night
    market are all a short ride away.
  image: ../../assets/images/home/location.jpg
  distances:
    - place: Hoi An Ancient Town
      time: 10 min by bike
    - place: An Bang Beach
      time: 10 min by car
    - place: Da Nang Airport
      time: 45 min by car
faqs:
  - question: What are the check-in and check-out times?
    answer: Check-in is from 2:00 pm and check-out is by 11:00 am. Early or late times can often be arranged — just ask.
  - question: Can you arrange an airport pickup?
    answer: Yes. We can arrange a private car from Da Nang Airport for you.
  - question: Is the villa suitable for children?
    answer: Yes, families are very welcome. Let us know if you need a cot or high chair.
  - question: How do I pay?
    answer: We take a deposit to confirm your booking by bank transfer or PayPal, and the balance on arrival.
